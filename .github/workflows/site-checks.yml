name: Check JC Pit

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Validate pages, catalog and public file manifest
        run: python3 scripts/check-site.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check metal-selection.js
          node --check warm-choice.js
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/jc-pit-test" --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.65.0
          "$RUNNER_TEMP/jc-pit-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check galleries and forms in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 5 --retry-connrefused http://127.0.0.1:8765/ -o /dev/null
          NODE_PATH="$RUNNER_TEMP/jc-pit-test/node_modules" node scripts/site-smoke.cjs
